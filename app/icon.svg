  </style>
  <circle class="ink" cx="12.5" cy="16" r="8.5" stroke-width="2.4" opacity="0.45" />
  <circle class="accent" cx="19.5" cy="16" r="8.5" stroke-width="2.4" />
  <circle class="dot" cx="19.5" cy="16" r="2.6" />
</svg>
